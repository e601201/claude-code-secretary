  <ellipse cx="102" cy="108" rx="6" ry="9" fill="#2b2b2b"/>
  <ellipse cx="138" cy="108" rx="6" ry="9" fill="#2b2b2b"/>
  <circle cx="104" cy="105" r="2" fill="#fff"/>
  <circle cx="140" cy="105" r="2" fill="#fff"/>
  <!-- 頬 -->
  <circle cx="92" cy="122" r="6" fill="rgba(255,120,140,0.35)"/>
  <circle cx="148" cy="122" r="6" fill="rgba(255,120,140,0.35)"/>
  <!-- 口 -->
  <path d="M112 128 Q120 135 128 128" stroke="#c0605f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- リボン -->
  <path d="M112 66 L100 58 L104 72 Z M128 66 L140 58 L136 72 Z" fill="#ff7a90"/>
  <circle cx="120" cy="66" r="4" fill="#ff5a75"/>
