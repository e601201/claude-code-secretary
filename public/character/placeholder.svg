  <!-- 襟 -->
  <path d="M100 172 L120 195 L140 172 Q120 165 100 172 Z" fill="#fff"/>
  <!-- 腕 -->
  <path d="M90 180 Q60 220 78 262" stroke="#f6d3b8" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M150 180 Q180 220 162 262" stroke="#f6d3b8" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- 首 -->
  <rect x="110" y="140" width="20" height="30" rx="8" fill="#f6d3b8"/>
  <!-- 髪(後ろ) -->
  <path d="M62 120 Q60 40 120 36 Q180 40 178 120 L172 175 L68 175 Z" fill="#3a2a2a"/>
