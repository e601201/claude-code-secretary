[package]
name = "secretary-channel"
version = "0.1.0"
edition = "2021"
description = "秘書アプリを Claude Code の channel にする stdio MCP サーバー(Phase 10)"

[[bin]]
name = "secretary-channel"
path = "src/main.rs"

[dependencies]
secretary-core = { version = "0.1.0", path = "../secretary-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
