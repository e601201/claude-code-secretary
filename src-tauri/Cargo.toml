[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: 設定フォルダの立ち絵(character.png)を webview から読むため
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secretary-core = { version = "0.1.0", path = "../crates/secretary-core" }
axum = "0.8"
tokio = { version = "1.53.1", features = ["time", "sync", "net", "io-util"] }
toml = "1.1.5"
uuid = { version = "1.26.0", features = ["v4"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.4.0"
ts-rs = "12"

